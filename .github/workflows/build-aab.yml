# Builds the El Kaptin driver Android App Bundle (.aab) for a Play upload.
#
# On-demand only (no push trigger) so it doesn't double every mobile CI run —
# the APK workflow already compile-checks every change. Run this when you want a
# bundle to upload: Actions -> "Build driver AAB" -> Run workflow.
#
# The bundle is signed with Flutter's default debug key, which is fine for an
# INTERNAL TEST track. For a production upload, wire your upload keystore first —
# see docs/RELEASE-SIGNING.md.
name: Build driver AAB

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "Backend base URL, e.g. https://elkaptin.example.com"
        required: true
        default: "https://api.meshwar.app"
      ws_base:
        description: "WebSocket base URL, e.g. wss://elkaptin.example.com"
        required: true
        default: "wss://api.meshwar.app"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/flutter
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project (scaffold + permissions + icons)
        run: bash tool/prepare_android.sh

      - name: Build release AAB
        env:
          API_BASE: ${{ inputs.api_base }}
          WS_BASE: ${{ inputs.ws_base }}
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE="$API_BASE" \
            --dart-define=WS_BASE="$WS_BASE"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: el-kaptin-driver-aab
          path: mobile/flutter/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
